<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANN & CNN Classroom MCQ Quiz</title>
<style>
:root{--ink:#1f2937;--muted:#64748b;--line:#dbe3ee;--blue:#2457c5;--pale:#f4f7fb;--good:#e8f7ed;--bad:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#142746;color:white;padding:28px 18px}header .wrap,main{max-width:900px;margin:auto}h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.2rem)}header p{margin:0;color:#dce7f8}
main{padding:22px 14px 50px}.toolbar{position:sticky;top:0;z-index:3;background:#ffffffed;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select,button{font:inherit;border-radius:9px;padding:10px 14px;border:1px solid var(--line);background:white;color:var(--ink)}button{cursor:pointer;font-weight:650}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:hover{filter:brightness(.97)}.progress{height:7px;background:#e6ebf3;border-radius:8px;overflow:hidden;margin-top:10px;width:100%}.progress span{display:block;height:100%;background:var(--blue);width:0}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #13294b08}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.num{font-size:.82rem;color:var(--muted);font-weight:700}.topic{font-size:.75rem;border-radius:20px;background:#eaf0ff;color:#244da5;padding:4px 9px;white-space:nowrap}.question{font-weight:700;font-size:1.04rem;margin:8px 0 14px}.option{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid #e3e8f0;border-radius:9px;margin:8px 0;cursor:pointer}.option:hover{background:#f8faff}.option input{margin-top:5px;accent-color:var(--blue)}.feedback{display:none;margin-top:12px;padding:12px;border-radius:9px}.feedback.good{display:block;background:var(--good);border:1px solid #b5e2c2}.feedback.bad{display:block;background:var(--bad);border:1px solid #f0c2c2}.small{font-size:.9rem;color:var(--muted)}#result{display:none;background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px}#result h2{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:600px){.card{padding:14px}.toolbar{position:static}.question{font-size:1rem}}
</style></head>
<body>
<header><div class="wrap"><h1>ANN & CNN Classroom MCQ Quiz</h1><p>60 questions based on classroom notes • instant feedback • score and percentage</p></div></header>
<main>
<div class="toolbar">
<div><strong id="count">60 questions</strong><div class="small" id="answered">0 answered</div></div>
<label>Show section: <select id="filter"><option value="all">All questions (60)</option><option value="ANN">ANN only (30)</option><option value="CNN">CNN only (30)</option></select></label>
<div class="actions" style="margin:0"><button class="primary" id="submit">Submit quiz</button><button id="reset">Restart</button></div>
<div class="progress"><span id="bar"></span></div>
</div>
<div id="quiz"></div>
<div id="result" aria-live="polite"></div>
</main>
<script>
const questions = [["What does ANN stand for?", ["Artificial Neural Network", "Automated Numeric Node", "Advanced Network Notation", "Artificial Number Navigator"], 0, "ANN stands for Artificial Neural Network, a model inspired by connected neurons."], ["What is the main purpose of an artificial neural network?", ["Store files", "Learn patterns from data", "Only sort data", "Replace databases"], 1, "An ANN learns relationships and patterns from examples to make predictions."], ["Which layer receives the input features?", ["Output layer", "Hidden layer", "Input layer", "Pooling layer"], 2, "The input layer receives the feature values supplied to the network."], ["Which layer produces the network's final prediction?", ["Input layer", "Output layer", "Convolution layer", "Dropout layer"], 1, "The output layer produces the prediction, such as a class score or numeric value."], ["In a neuron, what is the role of weights?", ["Control image size", "Represent the strength of input connections", "Count epochs", "Split the dataset"], 1, "Weights determine how strongly each input contributes to the neuron's calculation."], ["What does a bias allow a neuron to do?", ["Shift its activation independently of the inputs", "Remove all weights", "Increase image resolution", "Create labels automatically"], 0, "Bias is an additional learnable term that shifts the weighted sum."], ["Which expression represents a neuron's weighted sum?", ["z = X + W only", "z = Σ(wᵢxᵢ) + b", "z = x / y", "z = epochs × batch"], 1, "A neuron's pre-activation value is the sum of input-weight products plus bias."], ["Why are activation functions used?", ["To introduce non-linearity", "To save the model as a file", "To divide data into folders", "To remove the output layer"], 0, "Non-linear activation functions let neural networks learn complex relationships."], ["Which activation function outputs values between 0 and 1?", ["ReLU", "Tanh", "Sigmoid", "Linear"], 2, "Sigmoid maps any real input to a value between 0 and 1."], ["Which activation function returns max(0, x)?", ["Softmax", "ReLU", "Sigmoid", "Tanh"], 1, "ReLU outputs zero for negative inputs and the input itself for positive inputs."], ["Which activation is commonly used to convert multiclass output scores into probabilities?", ["Softmax", "ReLU", "Linear", "Dropout"], 0, "Softmax converts a vector of class scores into probabilities that sum to one."], ["Tanh activation outputs values in which range?", ["0 to 1", "-1 to 1", "0 to infinity", "1 to 100"], 1, "The hyperbolic tangent function outputs values between -1 and 1."], ["What is forward propagation?", ["Sending inputs through the network to calculate a prediction", "Removing incorrect rows", "Updating weights backward", "Splitting images into patches"], 0, "During forward propagation, values flow from input through layers to the output."], ["What does a loss function measure?", ["Difference between prediction and target", "Number of hidden layers only", "Dataset file size", "Number of features only"], 0, "Loss quantifies how far predictions are from the expected targets."], ["Which loss is commonly used for regression?", ["Mean Squared Error", "Categorical accuracy", "Max pooling", "Softmax"], 0, "Mean Squared Error measures the average squared difference between predictions and targets."], ["Which loss family is commonly used for classification?", ["Cross-entropy", "Mean image pooling", "Euclidean resize", "Dropout loss only"], 0, "Cross-entropy penalizes incorrect predicted class probabilities."], ["What is backpropagation used for?", ["Calculate gradients of the loss with respect to parameters", "Convert labels to images", "Choose the test set", "Increase batch size automatically"], 0, "Backpropagation applies the chain rule to compute gradients through the network."], ["What does an optimizer do?", ["Updates model parameters to reduce loss", "Only displays charts", "Labels training images", "Removes activation functions"], 0, "Optimizers use gradients to update weights and biases during training."], ["What does the learning rate control?", ["Size of parameter update steps", "Number of classes", "Image color channels", "Number of test labels"], 0, "A learning rate that is too high may overshoot; one that is too low may learn slowly."], ["What is one epoch?", ["One full pass through the training dataset", "One neuron", "One class prediction", "One weight only"], 0, "An epoch means the model has processed the entire training dataset once."], ["If there are 1,000 samples and batch size is 100, how many iterations are in one epoch?", ["1", "10", "100", "1,000"], 1, "There are 1,000 / 100 = 10 batches, so 10 parameter-update iterations per epoch."], ["What is a batch in neural-network training?", ["A subset of training samples processed together", "A single activation function", "The final output layer", "A model file"], 0, "Training data is often divided into batches to calculate gradients and update parameters."], ["What is overfitting?", ["The model memorizes training details and generalizes poorly", "The model cannot learn any pattern", "The model has no output", "The model uses no data"], 0, "Overfitting occurs when training performance is good but performance on unseen data is poor."], ["Which technique randomly disables some units during training to help reduce overfitting?", ["Dropout", "Softmax", "Flatten", "One-hot encoding"], 0, "Dropout temporarily disables selected units during training to reduce co-adaptation."], ["What is the purpose of a validation set?", ["Tune models and hyperparameters", "Train the model only", "Replace all training data", "Generate weights manually"], 0, "Validation data helps compare model settings during development."], ["What is the main purpose of a test set?", ["Final evaluation on held-out data", "Repeatedly update model weights", "Choose every epoch's gradients", "Create the neural network architecture"], 0, "The test set estimates performance on unseen data after model selection."], ["Which is an example of a hyperparameter?", ["Learning rate", "A learned weight after training", "One prediction", "A target label"], 0, "Hyperparameters are settings chosen before or around training, such as learning rate and batch size."], ["Why can a single-layer perceptron fail to solve XOR?", ["XOR is not linearly separable", "XOR has no inputs", "It requires image filters", "It has too many output pixels"], 0, "A single linear decision boundary cannot separate XOR's classes; hidden layers and non-linearities can."], ["What is the typical role of a hidden layer?", ["Learn intermediate representations", "Receive raw data only", "Store the test labels", "Calculate accuracy without data"], 0, "Hidden layers transform inputs into learned representations useful for prediction."], ["Which ANN architecture is especially designed to exploit spatial patterns in images?", ["CNN", "Simple linear regression", "SQL table", "Decision list"], 0, "CNNs use convolutional filters to learn local spatial features in images."], ["What does CNN stand for?", ["Convolutional Neural Network", "Connected Numeric Node", "Central Network Number", "Convolution Number Notation"], 0, "CNN stands for Convolutional Neural Network."], ["Why are CNNs commonly used for image tasks?", ["They learn spatial features using shared filters", "They only work with text", "They need no training data", "They convert every image directly to a sentence"], 0, "Convolutional filters detect local patterns such as edges, textures, and shapes."], ["What is a kernel or filter in a CNN?", ["A small learnable matrix applied across an input", "The test dataset", "A loss function", "The class label"], 0, "A kernel slides over the input and computes values that form a feature map."], ["What is a feature map?", ["Output produced by applying a filter to an input", "A list of class labels", "The optimizer configuration", "A training schedule"], 0, "A feature map indicates where a filter's learned pattern appears in the input."], ["What can early CNN layers learn?", ["Simple edges and textures", "Only complete objects", "Only class names", "Only final probabilities"], 0, "Early layers often learn low-level features; deeper layers combine them into more complex patterns."], ["Which operation is performed in a convolution layer?", ["Apply filters across local regions of the input", "Randomly shuffle labels", "Calculate only the final accuracy", "Convert all pixels to text"], 0, "Convolution combines local input values with filter weights to create feature maps."], ["What is the role of ReLU after convolution?", ["Introduce non-linearity", "Reduce every image to one pixel", "Split training and test sets", "Set all values to one"], 0, "ReLU helps the CNN learn non-linear feature relationships."], ["What does max pooling do?", ["Selects the maximum value in each pooling region", "Calculates the mean of the entire dataset", "Adds new color channels", "Updates all filter weights"], 0, "Max pooling keeps the strongest activation within each local region."], ["What does average pooling do?", ["Calculates the average value in each pooling region", "Selects only the largest value", "Applies softmax", "Adds a bias term"], 0, "Average pooling summarizes each region using its average value."], ["What is a common purpose of pooling?", ["Downsample feature maps and reduce computation", "Increase the number of pixels", "Replace all convolution layers", "Generate ground-truth labels"], 0, "Pooling reduces spatial dimensions and can make features less sensitive to small shifts."], ["What does padding='valid' generally mean in a convolution layer?", ["No padding is added around the input", "Zeros are always added to preserve size", "The input is randomly rotated", "The output is always a vector of length 10"], 0, "Valid convolution uses no added padding, so spatial output dimensions usually shrink."], ["What does padding='same' generally aim to do with stride 1?", ["Keep output height and width the same as input", "Remove all filters", "Make output dimensions zero", "Double the number of channels"], 0, "Same padding adds padding as needed so stride-1 convolution preserves spatial dimensions."], ["What is stride in convolution?", ["Step size by which the filter moves", "Number of output classes", "Learning rate", "Number of epochs"], 0, "A larger stride moves the filter farther each step and typically reduces output dimensions."], ["What happens when the stride increases, with other settings fixed?", ["Output feature map usually becomes smaller", "Output always doubles in size", "The kernel stops learning", "Loss becomes zero"], 0, "Larger strides sample fewer filter positions, usually producing smaller feature maps."], ["What is the purpose of the Flatten layer?", ["Convert multi-dimensional feature maps into a one-dimensional vector", "Apply max pooling", "Learn image edges", "Normalize labels"], 0, "Flatten reshapes the extracted features into a vector for dense layers."], ["What is the role of a Dense layer in a typical CNN classifier?", ["Combine extracted features for prediction", "Slide a kernel over the image", "Downsample spatial dimensions only", "Load image files"], 0, "Dense layers use the extracted features to produce class scores or other outputs."], ["Which sequence best describes a basic CNN image-classification pipeline?", ["Image → Convolution → Pooling → Flatten → Dense → Prediction", "Image → Prediction → Convolution → File", "Pooling → Image → Label → Kernel", "Dense → Image → Pooling → Input"], 0, "Convolution extracts features, pooling downsamples them, and dense layers perform classification."], ["Which filter is often associated with detecting horizontal intensity changes?", ["Sobel filter", "Softmax", "Dropout", "Flatten"], 0, "Sobel operators estimate image gradients; one orientation emphasizes horizontal changes and the other vertical changes."], ["Which operation is commonly used to emphasize second-order intensity changes or edges?", ["Laplacian filter", "Softmax", "Batch normalization only", "Dense output"], 0, "The Laplacian uses second derivatives and can highlight rapid intensity changes."], ["What is one difference between a traditional fixed edge filter and a CNN filter?", ["CNN filters are learned from training data", "CNN filters cannot detect patterns", "Traditional filters always require labels", "There is no difference"], 0, "Traditional Sobel/Laplacian kernels are predefined; CNN kernels are optimized during training."], ["Why do CNNs use shared filter weights across an image?", ["To detect the same pattern at different locations with fewer parameters", "To give every pixel a unique model", "To prevent feature maps", "To remove the need for training"], 0, "Weight sharing lowers parameter count and allows a learned feature to be detected across locations."], ["What is a channel in an RGB image?", ["One color component such as red, green, or blue", "A training epoch", "A pooling window", "A class probability"], 0, "RGB images typically have three channels: red, green, and blue."], ["If an input image is 32 × 32 × 3, what do the dimensions represent?", ["Height, width, and three color channels", "Three images of size 32 × 32", "32 classes and 3 epochs", "Kernel size and stride"], 0, "The tensor has height 32, width 32, and 3 color channels."], ["What does the number of filters in a convolution layer usually determine?", ["Number of output feature-map channels", "Number of training examples", "Number of classes in the dataset in every case", "The learning rate"], 0, "Each filter generally produces one output feature map, so filter count determines output channels."], ["What does kernel_size=(3, 3) mean?", ["The filter has height 3 and width 3", "The image has three channels", "There are three epochs", "There are three classes"], 0, "A 3 × 3 kernel covers a local region three pixels high and wide."], ["What is the purpose of data normalization for image inputs?", ["Put pixel values on a more manageable scale", "Add more labels", "Replace the CNN with an ANN", "Guarantee 100% accuracy"], 0, "Scaling pixels, often to 0–1, can make optimization more stable."], ["What does an epoch mean when training a CNN?", ["One pass through the training dataset", "One convolution filter", "One pixel", "One output class"], 0, "An epoch is one complete pass over the training samples."], ["What does batch size specify?", ["How many samples are processed in one training batch", "How many filters exist in every layer", "How many classes are predicted", "How many pixels are in a kernel"], 0, "Batch size determines how many examples contribute to a gradient update."], ["Why might dropout be used in CNN dense layers?", ["To help reduce overfitting", "To increase image dimensions", "To create convolution kernels manually", "To remove the need for a loss function"], 0, "Dropout regularizes the model by randomly disabling units during training."], ["Which output activation is commonly used for mutually exclusive multi-class image classification?", ["Softmax", "ReLU only", "Tanh only", "Max pooling"], 0, "Softmax gives a probability distribution across the mutually exclusive classes."]];
const quiz=document.getElementById('quiz'), filter=document.getElementById('filter');
function render(){
 quiz.innerHTML='';
 const visible=questions.map((q,i)=>({...q,index:i})).filter(q=>filter.value==='all'||(q.index<30?'ANN':'CNN')===filter.value);
 document.getElementById('count').textContent=visible.length+' questions';
 visible.forEach(q=>{
  const topic=q.index<30?'ANN':'CNN', card=document.createElement('section');card.className='card';card.dataset.index=q.index;
  const options=q[1].map((opt,j)=>`<label class="option"><input type="radio" name="q${q.index}" value="${j}"><span><strong>${String.fromCharCode(65+j)}.</strong> ${opt}</span></label>`).join('');
  card.innerHTML=`<div class="qhead"><span class="num">Question ${q.index+1}</span><span class="topic">${topic}</span></div><div class="question">${q[0]}</div><div class="options">${options}</div><button class="check">Check answer</button><div class="feedback"></div>`;
  card.querySelectorAll('input').forEach(input=>input.addEventListener('change',updateProgress));
  card.querySelector('.check').addEventListener('click',()=>{
   const chosen=card.querySelector('input:checked'), fb=card.querySelector('.feedback');
   if(!chosen){fb.className='feedback bad';fb.textContent='Choose an answer first.';return}
   const correct=Number(chosen.value)===q[2];
   fb.className='feedback '+(correct?'good':'bad');
   fb.innerHTML=`<strong>${correct?'Correct!':'Not quite.'}</strong> ${correct?'':'Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'. '}<br>${q[3]}`;
  });
  quiz.appendChild(card);
 });
 document.getElementById('result').style.display='none';updateProgress();
}
function updateProgress(){
 const visible=[...quiz.querySelectorAll('.card')], answered=visible.filter(c=>c.querySelector('input:checked')).length;
 document.getElementById('answered').textContent=answered+' of '+visible.length+' answered';
 document.getElementById('bar').style.width=(visible.length?answered/visible.length*100:0)+'%';
}
document.getElementById('submit').addEventListener('click',()=>{
 const visible=[...quiz.querySelectorAll('.card')];let score=0,answered=0,unanswered=[];
 visible.forEach(card=>{
  const idx=Number(card.dataset.index),q=questions[idx],chosen=card.querySelector('input:checked');
  if(chosen){answered++;if(Number(chosen.value)===q[2])score++}else unanswered.push(idx+1);
  const fb=card.querySelector('.feedback');
  if(chosen){const ok=Number(chosen.value)===q[2];fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<strong>${ok?'Correct!':'Incorrect.'}</strong> ${ok?'':'Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'. '}<br>${q[3]}`}
 });
 const pct=Math.round(score/visible.length*100),r=document.getElementById('result');r.style.display='block';
 r.innerHTML=`<h2>Your result</h2><p><strong>${score} / ${visible.length}</strong> correct (${pct}%)</p><p>You answered ${answered} questions. ${unanswered.length?unanswered.length+' unanswered.':'All questions answered.'}</p><div class="actions"><button class="primary" id="review">Review answers</button><button id="again">Try again</button></div>`;
 document.getElementById('review').onclick=()=>{const first=quiz.querySelector('.feedback');if(first)first.scrollIntoView({behavior:'smooth',block:'center'})};
 document.getElementById('again').onclick=()=>{quiz.querySelectorAll('input').forEach(i=>i.checked=false);quiz.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});r.style.display='none';updateProgress();window.scrollTo({top:0,behavior:'smooth'})};
 r.scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('reset').addEventListener('click',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});
filter.addEventListener('change',render);
render();
</script></body></html>
